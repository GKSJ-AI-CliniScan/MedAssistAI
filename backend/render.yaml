services:
  - type: web
    name: medassistai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_NAME
        value: MedAssistAI Backend
      - key: APP_VERSION
        value: 1.0.0
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: medassistai-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: ALLOWED_ORIGINS
        value: "https://medassistai.vercel.app"

databases:
  - name: medassistai-db
    databaseName: medassistai
    user: postgres
    plan: free
