version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: medassistai_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: medassistai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medassistai_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=MedAssistAI Backend
      - APP_VERSION=1.0.0
      - DEBUG=False
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/medassistai
      - SECRET_KEY=MedAssistAI@2026$JWT#Secure%Key!987654321
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
    volumes:
      - ./app/ml:/app/app/ml

volumes:
  postgres_data:
