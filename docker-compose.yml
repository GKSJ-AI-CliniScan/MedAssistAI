services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/reports:/app/reports
      - ./backend/data:/app/data

  frontend:
    build: ./medassist-ai-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend